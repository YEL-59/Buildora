<svg width="260" height="54" viewBox="0 0 260 54" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FFF3A8" />
    <stop offset="35%" stop-color="#FFDB5A" />
    <stop offset="70%" stop-color="#F5C024" />
    <stop offset="100%" stop-color="#E29E0B" />
  </linearGradient>

  <linearGradient id="textGold" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FFE57A" />
    <stop offset="45%" stop-color="#FFDB5A" />
    <stop offset="100%" stop-color="#F0B51A" />
  </linearGradient>

  <linearGradient id="craneSteel" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#243D61" />
    <stop offset="60%" stop-color="#14243B" />
    <stop offset="100%" stop-color="#0B1524" />
  </linearGradient>

  <filter id="craneGlow" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#050C17" flood-opacity="0.55" />
  </filter>

  <style>
    @keyframes travelRightToLeft {
      0% { transform: translateX(0px); }
      10% { transform: translateX(0px); }
      50% { transform: translateX(-190px); }
      65% { transform: translateX(-190px); }
      92% { transform: translateX(0px); }
      100% { transform: translateX(0px); }
    }

    @keyframes swayCargo {
      0% { transform: rotate(0deg); }
      12% { transform: rotate(0deg); }
      20% { transform: rotate(2.8deg); }
      35% { transform: rotate(2.2deg); }
      48% { transform: rotate(-1.5deg); }
      52% { transform: rotate(0.8deg); }
      56% { transform: rotate(-0.3deg); }
      60% { transform: rotate(0deg); }
      65% { transform: rotate(0deg); }
      70% { transform: rotate(-2.8deg); }
      82% { transform: rotate(-1.8deg); }
      90% { transform: rotate(1.2deg); }
      95% { transform: rotate(-0.4deg); }
      100% { transform: rotate(0deg); }
    }

    .crane-moving-assembly {
      animation: travelRightToLeft 6s cubic-bezier(0.42, 0, 0.58, 1) infinite;
    }

    .crane-suspended-girder {
      animation: swayCargo 6s ease-in-out infinite;
      transform-origin: 224.5px 13px;
    }
  </style>
</defs>

<!-- Static Crane Structure -->
<g filter="url(#craneGlow)">
  <!-- Tower Mast -->
  <path d="M12 49V13.5H16.5V49H12Z" fill="url(#craneSteel)" />
  <line x1="12" y1="20" x2="16.5" y2="20" stroke="#FFDB5A" stroke-width="0.8" />
  <line x1="12" y1="26" x2="16.5" y2="26" stroke="#FFDB5A" stroke-width="0.8" />
  <line x1="12" y1="32" x2="16.5" y2="32" stroke="#FFDB5A" stroke-width="0.8" />
  <line x1="12" y1="38" x2="16.5" y2="38" stroke="#FFDB5A" stroke-width="0.8" />
  <line x1="12" y1="44" x2="16.5" y2="44" stroke="#FFDB5A" stroke-width="0.8" />
  <line x1="12" y1="14" x2="16.5" y2="20" stroke="#FFDB5A" stroke-width="0.75" /><line x1="12" y1="20" x2="16.5" y2="14" stroke="#FFDB5A" stroke-width="0.75" /><line x1="12" y1="20" x2="16.5" y2="26" stroke="#FFDB5A" stroke-width="0.75" /><line x1="12" y1="26" x2="16.5" y2="20" stroke="#FFDB5A" stroke-width="0.75" /><line x1="12" y1="26" x2="16.5" y2="32" stroke="#FFDB5A" stroke-width="0.75" /><line x1="12" y1="32" x2="16.5" y2="26" stroke="#FFDB5A" stroke-width="0.75" /><line x1="12" y1="32" x2="16.5" y2="38" stroke="#FFDB5A" stroke-width="0.75" /><line x1="12" y1="38" x2="16.5" y2="32" stroke="#FFDB5A" stroke-width="0.75" /><line x1="12" y1="38" x2="16.5" y2="44" stroke="#FFDB5A" stroke-width="0.75" /><line x1="12" y1="44" x2="16.5" y2="38" stroke="#FFDB5A" stroke-width="0.75" /><line x1="12" y1="44" x2="16.5" y2="50" stroke="#FFDB5A" stroke-width="0.75" /><line x1="12" y1="50" x2="16.5" y2="44" stroke="#FFDB5A" stroke-width="0.75" />

  <!-- Mast Base Foundation Pad -->
  <rect x="9.5" y="47.5" width="9.5" height="2.5" rx="0.5" fill="url(#goldGrad)" />

  <!-- Operator Cabin & Slewing Ring -->
  <rect x="15" y="11.5" width="4.5" height="4" rx="0.6" fill="url(#craneSteel)" stroke="#FFDB5A" stroke-width="0.6" />
  <rect x="16.5" y="12.5" width="2" height="1.8" rx="0.3" fill="#FFDB5A" />
  <rect x="11.5" y="13.5" width="6" height="1.2" rx="0.3" fill="url(#goldGrad)" />

  <!-- Crane Apex -->
  <path d="M11.5 13.5L14.2 3.2L17 13.5Z" fill="url(#craneSteel)" />
  <circle cx="14.2" cy="3.2" r="1.2" fill="url(#goldGrad)" />

  <!-- Rear Counter-Jib & Counterweight -->
  <line x1="12" y1="9.8" x2="3.5" y2="9.8" stroke="#FFDB5A" stroke-width="1.6" stroke-linecap="round" />
  <line x1="14.2" y1="3.2" x2="4.5" y2="9.8" stroke="#CAD5E2" stroke-width="0.8" />
  <rect x="2.5" y="10.8" width="5" height="4" rx="0.6" fill="url(#craneSteel)" stroke="#FFDB5A" stroke-width="0.8" />
  <line x1="5" y1="10.8" x2="5" y2="14.8" stroke="#FFDB5A" stroke-width="0.6" />

  <!-- Full-Spanning Jib (Boom) -->
  <line x1="14" y1="8.5" x2="253" y2="8.5" stroke="#FFDB5A" stroke-width="1.5" stroke-linecap="round" />
  <line x1="16.5" y1="11" x2="251" y2="11" stroke="#FFDB5A" stroke-width="1.2" stroke-linecap="round" />
  <path d="M251 11L254 8.5L251 8.5Z" fill="#FFDB5A" />
  <circle cx="254" cy="8.5" r="1" fill="#FF4444" />
  <line x1="16" y1="8.5" x2="21" y2="11" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="21" y1="11" x2="26" y2="8.5" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="26" y1="8.5" x2="31" y2="11" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="31" y1="11" x2="36" y2="8.5" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="36" y1="8.5" x2="41" y2="11" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="41" y1="11" x2="46" y2="8.5" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="46" y1="8.5" x2="51" y2="11" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="51" y1="11" x2="56" y2="8.5" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="56" y1="8.5" x2="61" y2="11" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="61" y1="11" x2="66" y2="8.5" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="66" y1="8.5" x2="71" y2="11" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="71" y1="11" x2="76" y2="8.5" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="76" y1="8.5" x2="81" y2="11" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="81" y1="11" x2="86" y2="8.5" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="86" y1="8.5" x2="91" y2="11" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="91" y1="11" x2="96" y2="8.5" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="96" y1="8.5" x2="101" y2="11" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="101" y1="11" x2="106" y2="8.5" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="106" y1="8.5" x2="111" y2="11" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="111" y1="11" x2="116" y2="8.5" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="116" y1="8.5" x2="121" y2="11" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="121" y1="11" x2="126" y2="8.5" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="126" y1="8.5" x2="131" y2="11" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="131" y1="11" x2="136" y2="8.5" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="136" y1="8.5" x2="141" y2="11" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="141" y1="11" x2="146" y2="8.5" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="146" y1="8.5" x2="151" y2="11" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="151" y1="11" x2="156" y2="8.5" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="156" y1="8.5" x2="161" y2="11" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="161" y1="11" x2="166" y2="8.5" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="166" y1="8.5" x2="171" y2="11" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="171" y1="11" x2="176" y2="8.5" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="176" y1="8.5" x2="181" y2="11" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="181" y1="11" x2="186" y2="8.5" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="186" y1="8.5" x2="191" y2="11" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="191" y1="11" x2="196" y2="8.5" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="196" y1="8.5" x2="201" y2="11" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="201" y1="11" x2="206" y2="8.5" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="206" y1="8.5" x2="211" y2="11" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="211" y1="11" x2="216" y2="8.5" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="216" y1="8.5" x2="221" y2="11" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="221" y1="11" x2="226" y2="8.5" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="226" y1="8.5" x2="231" y2="11" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="231" y1="11" x2="236" y2="8.5" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="236" y1="8.5" x2="241" y2="11" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="241" y1="11" x2="246" y2="8.5" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="246" y1="8.5" x2="251" y2="11" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" /><line x1="251" y1="11" x2="256" y2="8.5" stroke="#FFDB5A" stroke-width="0.65" opacity="0.8" />

  <!-- Tension Stay Cables -->
  <line x1="14.2" y1="3.2" x2="65" y2="8.5" stroke="#CAD5E2" stroke-width="0.75" opacity="0.85" />
  <line x1="14.2" y1="3.2" x2="125" y2="8.5" stroke="#CAD5E2" stroke-width="0.75" opacity="0.85" />
