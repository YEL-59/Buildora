<!-- 3. SUBTITLE: "CONSTRUCTION & ARCHITECTURE"                      -->
<!-- ============================================================== -->
<g opacity="0.95">
  <line x1="27" y1="46" x2="35" y2="46" stroke="#FFDB5A" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="37.5" cy="46" r="0.9" fill="#FFDB5A" />
