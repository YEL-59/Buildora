<svg viewBox="0 0 1600 320" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice" className="w-full h-full">
  <defs>
    <!-- Gradients -->
    <linearGradient id="footerBuildingGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E7199" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#243B5C" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#12223B" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="footerBuildingGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDB5A" stop-opacity="0.30" />
      <stop offset="30%" stop-color="#3A5C85" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#12223B" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="craneSteelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDB5A" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#7EA5D1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#2B476D" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDB5A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E5A910" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="craneGlowLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDB5A" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFDB5A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="craneGlowRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow Behind Cranes -->
  <circle cx="560" cy="120" r="160" fill="url(#craneGlowLeft)" />
  <circle cx="1080" cy="110" r="180" fill="url(#craneGlowRight)" />

  <!-- ==================== BACKGROUND BUILDINGS (Silhouette Layer 1) ==================== -->
  <g opacity="0.45">
    <!-- Far Tower 1 (Left) -->
    <rect x="70" y="140" width="70" height="180" fill="url(#footerBuildingGrad1)" />
    <polygon points="70,140 105,100 140,140" fill="url(#footerBuildingGrad1)" />
    <line x1="105" y1="100" x2="105" y2="70" stroke="#7EA5D1" stroke-width="1.5" stroke-opacity="0.5" />

    <!-- Far Tower 2 -->
    <rect x="230" y="110" width="85" height="210" fill="url(#footerBuildingGrad1)" />
    <rect x="250" y="80" width="45" height="30" fill="url(#footerBuildingGrad1)" />
    <line x1="272" y1="80" x2="272" y2="50" stroke="#FFDB5A" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Far Center Skyline Mass -->
    <rect x="620" y="90" width="110" height="230" fill="url(#footerBuildingGrad1)" />
    <polygon points="620,90 675,50 730,90" fill="url(#footerBuildingGrad1)" />
    <line x1="675" y1="50" x2="675" y2="25" stroke="#7EA5D1" stroke-width="1.5" stroke-opacity="0.5" />

    <!-- Far Right Spire Tower -->
    <rect x="1200" y="120" width="90" height="200" fill="url(#footerBuildingGrad1)" />
    <polygon points="1200,120 1245,65 1290,120" fill="url(#footerBuildingGrad1)" />
    <line x1="1245" y1="65" x2="1245" y2="35" stroke="#FFDB5A" stroke-width="1.5" stroke-opacity="0.6" />

    <rect x="1380" y="150" width="110" height="170" fill="url(#footerBuildingGrad1)" />
  </g>

  <!-- ==================== MIDGROUND BUILDINGS WITH ARCHITECTURAL DETAILS ==================== -->
  <g opacity="0.65">
    <!-- Building Left 1: Stepped Highrise -->
    <path d="M20 320V190H50V160H110V190H140V320H20Z" fill="url(#footerBuildingGrad1)" stroke="#5D85B3" stroke-width="0.8" stroke-opacity="0.4" />
    <!-- Window grid for Building Left 1 -->
    <g stroke="#FFDB5A" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 8">
      <line x1="60" y1="175" x2="60" y2="300" />
      <line x1="75" y1="175" x2="75" y2="300" />
      <line x1="85" y1="175" x2="85" y2="300" />
      <line x1="100" y1="175" x2="100" y2="300" />
    </g>

    <!-- Building Left 2: Angled Modern Glass Tower -->
    <path d="M155 320V150L215 110V320H155Z" fill="url(#footerBuildingGrad2)" stroke="#FFDB5A" stroke-width="0.8" stroke-opacity="0.5" />
    <!-- Diagonal architectural bracing -->
    <line x1="155" y1="150" x2="215" y2="210" stroke="#7EA5D1" stroke-width="0.75" stroke-opacity="0.35" />
    <line x1="155" y1="210" x2="215" y2="270" stroke="#7EA5D1" stroke-width="0.75" stroke-opacity="0.35" />
    <line x1="215" y1="110" x2="155" y2="170" stroke="#7EA5D1" stroke-width="0.75" stroke-opacity="0.35" />

    <!-- Building 3: Contemporary Terraced Tower -->
    <path d="M330 320V170H360V140H400V110H430V140H450V320H330Z" fill="url(#footerBuildingGrad1)" stroke="#5D85B3" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="415" y1="110" x2="415" y2="75" stroke="#FFDB5A" stroke-width="1.2" stroke-opacity="0.7" />

    <!-- Center Mega Skyscraper (Under construction / Core structure) -->
    <path d="M740 320V95H860V320H740Z" fill="url(#footerBuildingGrad1)" stroke="#5D85B3" stroke-width="1" stroke-opacity="0.5" />
    <!-- Exposed steel frame top levels -->
    <rect x="755" y="65" width="90" height="30" fill="none" stroke="#FFDB5A" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="6 3" />
    <line x1="775" y1="65" x2="775" y2="95" stroke="#FFDB5A" stroke-width="0.8" stroke-opacity="0.5" />
    <line x1="800" y1="65" x2="800" y2="95" stroke="#FFDB5A" stroke-width="0.8" stroke-opacity="0.5" />
    <line x1="825" y1="65" x2="825" y2="95" stroke="#FFDB5A" stroke-width="0.8" stroke-opacity="0.5" />
    <line x1="755" y1="80" x2="845" y2="80" stroke="#FFDB5A" stroke-width="0.8" stroke-opacity="0.5" />

    <!-- Vertical mullions & window lights -->
    <g stroke="#7EA5D1" stroke-width="0.7" stroke-opacity="0.3">
      <line x1="765" y1="105" x2="765" y2="300" />
      <line x1="785" y1="105" x2="785" y2="300" />
      <line x1="805" y1="105" x2="805" y2="300" />
      <line x1="825" y1="105" x2="825" y2="300" />
      <line x1="845" y1="105" x2="845" y2="300" />
    </g>
    <!-- Some glowing gold window pods -->
    <rect x="762" y="130" width="6" height="4" fill="#FFDB5A" opacity="0.6" />
    <rect x="802" y="145" width="6" height="4" fill="#FFDB5A" opacity="0.7" />
    <rect x="822" y="180" width="6" height="4" fill="#FFDB5A" opacity="0.6" />
    <rect x="782" y="210" width="6" height="4" fill="#FFDB5A" opacity="0.5" />
    <rect x="842" y="160" width="6" height="4" fill="#FFDB5A" opacity="0.6" />

    <!-- Right Side Highrises (Twin Towers with Skybridge) -->
    <path d="M1270 320V125H1330V320H1270Z" fill="url(#footerBuildingGrad1)" stroke="#5D85B3" stroke-width="0.8" stroke-opacity="0.4" />
    <path d="M1365 320V110H1425V320H1365Z" fill="url(#footerBuildingGrad2)" stroke="#FFDB5A" stroke-width="0.8" stroke-opacity="0.4" />
    <!-- Skybridge connecting twin towers -->
    <rect x="1330" y="175" width="35" height="18" fill="url(#footerBuildingGrad1)" stroke="#FFDB5A" stroke-width="0.8" stroke-opacity="0.6" />
    <line x1="1330" y1="184" x2="1365" y2="184" stroke="#7EA5D1" stroke-width="0.75" stroke-opacity="0.4" />
    <!-- Antenna spire -->
    <line x1="1395" y1="110" x2="1395" y2="60" stroke="#FFDB5A" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="1395" cy="60" r="2" fill="#FFDB5A" className="animate-pulse" />

    <!-- Far Right Edge Tower -->
    <path d="M1460 320V165H1560V320H1460Z" fill="url(#footerBuildingGrad1)" stroke="#5D85B3" stroke-width="0.8" stroke-opacity="0.3" />
  </g>

  <!-- ==================== TOWER CRANES (PROMINENT FOREGROUND VECTORS) ==================== -->

  <!-- ===== CRANE 1 (LEFT / MID-LEFT TOWER CRANE: x = 480 to 710) ===== -->
  <g className="transition-all duration-500">
    <!-- Crane 1 Mast (Vertical Tower) -->
    <rect x="548" y="55" width="10" height="265" fill="#182C48" stroke="#FFDB5A" stroke-width="0.8" stroke-opacity="0.75" />
    <!-- Mast lattice X-braces -->
    <g stroke="#FFDB5A" stroke-width="0.7" stroke-opacity="0.65">
      <line x1="548" y1="65" x2="558" y2="80" />
      <line x1="548" y1="80" x2="558" y2="65" />
      <line x1="548" y1="80" x2="558" y2="95" />
      <line x1="548" y1="95" x2="558" y2="80" />
      <line x1="548" y1="95" x2="558" y2="110" />
      <line x1="548" y1="110" x2="558" y2="95" />
      <line x1="548" y1="110" x2="558" y2="125" />
      <line x1="548" y1="125" x2="558" y2="110" />
      <line x1="548" y1="125" x2="558" y2="140" />
      <line x1="548" y1="140" x2="558" y2="125" />
      <line x1="548" y1="140" x2="558" y2="155" />
      <line x1="548" y1="155" x2="558" y2="140" />
      <line x1="548" y1="155" x2="558" y2="170" />
      <line x1="548" y1="170" x2="558" y2="155" />
      <line x1="548" y1="170" x2="558" y2="185" />
      <line x1="548" y1="185" x2="558" y2="170" />
      <line x1="548" y1="185" x2="558" y2="200" />
      <line x1="548" y1="200" x2="558" y2="185" />
      <line x1="548" y1="200" x2="558" y2="215" />
      <line x1="548" y1="215" x2="558" y2="200" />
      <line x1="548" y1="215" x2="558" y2="230" />
      <line x1="548" y1="230" x2="558" y2="215" />
      <line x1="548" y1="230" x2="558" y2="245" />
      <line x1="548" y1="245" x2="558" y2="230" />
      <line x1="548" y1="245" x2="558" y2="260" />
      <line x1="548" y1="260" x2="558" y2="245" />
    </g>

    <!-- Slewing ring / Operator Cabin -->
    <rect x="558" y="52" width="9" height="10" rx="1.5" fill="#FFDB5A" fill-opacity="0.9" />
    <rect x="561" y="54" width="4" height="4" rx="0.5" fill="#12223B" />

    <!-- Tower Peak / Apex -->
    <polygon points="548,55 553,22 558,55" fill="#1B3150" stroke="#FFDB5A" stroke-width="1" />
    <!-- Blinking Aviation Beacon Light atop Apex -->
    <circle cx="553" cy="22" r="2.5" fill="#EF4444" />
    <circle cx="553" cy="22" r="5" fill="#EF4444" opacity="0.4" className="animate-ping" />

    <!-- Horizontal Jib & Counter-Jib Structure -->
    <!-- Counter Jib (Left): extends from 548 to 475 -->
    <line x1="475" y1="52" x2="558" y2="52" stroke="#FFDB5A" stroke-width="1.8" />
    <line x1="475" y1="56" x2="558" y2="56" stroke="#FFDB5A" stroke-width="1" />
    <!-- Counter Jib truss -->
    <g stroke="#FFDB5A" stroke-width="0.7" stroke-opacity="0.6">
      <line x1="480" y1="52" x2="495" y2="56" />
      <line x1="495" y1="52" x2="510" y2="56" />
      <line x1="510" y1="52" x2="525" y2="56" />
      <line x1="525" y1="52" x2="540" y2="56" />
      <line x1="540" y1="52" x2="555" y2="56" />
    </g>
    <!-- Counterweight block at rear -->
    <rect x="475" y="56" width="16" height="12" rx="1" fill="#FFDB5A" stroke="#12223B" stroke-width="1" />
    <line x1="483" y1="56" x2="483" y2="68" stroke="#12223B" stroke-width="0.8" />
    <!-- Counter-jib tie cable -->
    <line x1="553" y1="22" x2="478" y2="52" stroke="#FFDB5A" stroke-width="1.2" stroke-opacity="0.85" />

    <!-- Working Jib (Right): extends from 558 to 725 -->
    <line x1="558" y1="52" x2="725" y2="52" stroke="#FFDB5A" stroke-width="1.8" />
    <line x1="558" y1="57" x2="725" y2="57" stroke="#FFDB5A" stroke-width="1" />
    <!-- Working Jib truss cross-bracing -->
    <g stroke="#FFDB5A" stroke-width="0.7" stroke-opacity="0.6">
      <line x1="560" y1="52" x2="575" y2="57" />
      <line x1="575" y1="52" x2="590" y2="57" />
      <line x1="590" y1="52" x2="605" y2="57" />
      <line x1="605" y1="52" x2="620" y2="57" />
      <line x1="620" y1="52" x2="635" y2="57" />
      <line x1="635" y1="52" x2="650" y2="57" />
      <line x1="650" y1="52" x2="665" y2="57" />
      <line x1="665" y1="52" x2="680" y2="57" />
      <line x1="680" y1="52" x2="695" y2="57" />
      <line x1="695" y1="52" x2="710" y2="57" />
      <line x1="710" y1="52" x2="725" y2="57" />
    </g>
    <!-- Working Jib tie cables from apex -->
    <line x1="553" y1="22" x2="630" y2="52" stroke="#FFDB5A" stroke-width="1.2" stroke-opacity="0.85" />
    <line x1="553" y1="22" x2="690" y2="52" stroke="#FFDB5A" stroke-width="1.2" stroke-opacity="0.85" />
    <!-- Jib Tip Light -->
    <circle cx="725" cy="52" r="1.5" fill="#FFDB5A" />

    <!-- Trolley, Hoist Cable & Suspended Steel Beam -->
    <g>
      <!-- Trolley car -->
      <rect x="642" y="57" width="10" height="4" rx="0.5" fill="#FFDB5A" />
      <!-- Hoist Cable -->
      <line x1="647" y1="61" x2="647" y2="108" stroke="#FFDB5A" stroke-width="1" stroke-opacity="0.9" />
      <!-- Hook Block -->
      <polygon points="644,108 650,108 647,113" fill="#FFDB5A" />
      <path d="M647 113V117C647 119 645 119 644 118" stroke="#FFDB5A" stroke-width="1.2" fill="none" stroke-linecap="round" />
      <!-- Rigging Slings -->
      <line x1="647" y1="117" x2="628" y2="124" stroke="#CAD5E2" stroke-width="0.8" />
      <line x1="647" y1="117" x2="666" y2="124" stroke="#CAD5E2" stroke-width="0.8" />
      <!-- Suspended Steel Girder / Construction Material -->
      <rect x="622" y="124" width="50" height="3" fill="#FFDB5A" stroke="#12223B" stroke-width="0.6" />
      <rect x="624" y="127" width="46" height="5" fill="#243D61" stroke="#FFDB5A" stroke-width="0.6" />
      <rect x="622" y="132" width="50" height="3" fill="#FFDB5A" stroke="#12223B" stroke-width="0.6" />
      <!-- Girder bolts -->
      <circle cx="630" cy="129.5" r="1" fill="#FFDB5A" />
      <circle cx="641" cy="129.5" r="1" fill="#FFDB5A" />
      <circle cx="653" cy="129.5" r="1" fill="#FFDB5A" />
      <circle cx="664" cy="129.5" r="1" fill="#FFDB5A" />
    </g>
  </g>

  <!-- ===== CRANE 2 (RIGHT TOWER CRANE: x = 980 to 1230 atop skyscraper cluster) ===== -->
