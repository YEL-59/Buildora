    <!-- Crane 2 Mast -->
    <rect x="1052" y="38" width="9" height="282" fill="#182C48" stroke="#7EA5D1" stroke-width="0.8" stroke-opacity="0.8" />
    <!-- Mast lattice braces -->
    <g stroke="#7EA5D1" stroke-width="0.65" stroke-opacity="0.6">
      <line x1="1052" y1="48" x2="1061" y2="62" />
      <line x1="1052" y1="62" x2="1061" y2="48" />
      <line x1="1052" y1="62" x2="1061" y2="76" />
      <line x1="1052" y1="76" x2="1061" y2="62" />
      <line x1="1052" y1="76" x2="1061" y2="90" />
      <line x1="1052" y1="90" x2="1061" y2="76" />
      <line x1="1052" y1="90" x2="1061" y2="104" />
      <line x1="1052" y1="104" x2="1061" y2="90" />
      <line x1="1052" y1="104" x2="1061" y2="118" />
      <line x1="1052" y1="118" x2="1061" y2="104" />
      <line x1="1052" y1="118" x2="1061" y2="132" />
      <line x1="1052" y1="132" x2="1061" y2="118" />
      <line x1="1052" y1="132" x2="1061" y2="146" />
      <line x1="1052" y1="146" x2="1061" y2="132" />
      <line x1="1052" y1="146" x2="1061" y2="160" />
      <line x1="1052" y1="160" x2="1061" y2="146" />
    </g>

    <!-- Slewing cabin -->
    <rect x="1043" y="36" width="9" height="9" rx="1" fill="#7EA5D1" />

    <!-- Crane 2 Apex -->
    <polygon points="1052,38 1056.5,8 1061,38" fill="#1B3150" stroke="#7EA5D1" stroke-width="1" />
    <circle cx="1056.5" cy="8" r="2.5" fill="#FFDB5A" />
    <circle cx="1056.5" cy="8" r="5" fill="#FFDB5A" opacity="0.4" className="animate-ping" />

    <!-- Jib & Counter-Jib -->
    <!-- Working Jib extending left toward the central building: 1052 to 920 -->
    <line x1="920" y1="35" x2="1052" y2="35" stroke="#7EA5D1" stroke-width="1.8" />
    <line x1="920" y1="40" x2="1052" y2="40" stroke="#7EA5D1" stroke-width="1" />
    <g stroke="#7EA5D1" stroke-width="0.65" stroke-opacity="0.6">
      <line x1="935" y1="35" x2="920" y2="40" />
      <line x1="950" y1="35" x2="935" y2="40" />
      <line x1="965" y1="35" x2="950" y2="40" />
      <line x1="980" y1="35" x2="965" y2="40" />
      <line x1="995" y1="35" x2="980" y2="40" />
      <line x1="1010" y1="35" x2="995" y2="40" />
      <line x1="1025" y1="35" x2="1010" y2="40" />
      <line x1="1040" y1="35" x2="1025" y2="40" />
    </g>
    <!-- Tie cable -->
    <line x1="1056.5" y1="8" x2="950" y2="35" stroke="#7EA5D1" stroke-width="1.2" stroke-opacity="0.8" />

    <!-- Counter-jib (Right): 1061 to 1125 -->
    <line x1="1061" y1="35" x2="1125" y2="35" stroke="#7EA5D1" stroke-width="1.8" />
    <line x1="1061" y1="39" x2="1125" y2="39" stroke="#7EA5D1" stroke-width="1" />
    <!-- Counterweights -->
    <rect x="1110" y="39" width="15" height="11" rx="1" fill="#7EA5D1" stroke="#12223B" stroke-width="0.8" />
    <line x1="1056.5" y1="8" x2="1120" y2="35" stroke="#7EA5D1" stroke-width="1.2" stroke-opacity="0.8" />

    <!-- Trolley & Hoist over the mega building -->
    <rect x="965" y="40" width="8" height="3" rx="0.5" fill="#FFDB5A" />
    <line x1="969" y1="43" x2="969" y2="78" stroke="#FFDB5A" stroke-width="0.9" />
    <polygon points="966.5,78 971.5,78 969,82" fill="#FFDB5A" />
    <line x1="969" y1="82" x2="955" y2="88" stroke="#CAD5E2" stroke-width="0.75" />
    <line x1="969" y1="82" x2="983" y2="88" stroke="#CAD5E2" stroke-width="0.75" />
    <rect x="950" y="88" width="38" height="4" rx="0.5" fill="#FFDB5A" stroke="#12223B" stroke-width="0.6" />
